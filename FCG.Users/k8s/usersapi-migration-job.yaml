apiVersion: batch/v1
kind: Job
metadata:
  name: usersapi-migration
  namespace: fcg
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: usersapi-migration
    spec:
      restartPolicy: Never
      containers:
        - name: usersapi-migration
          image: daiana2026dev/users-api-image:migrations
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: usersapi-config
            - secretRef:
                name: usersapi-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"