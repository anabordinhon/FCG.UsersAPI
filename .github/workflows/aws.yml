name: CI/CD - UsersApi to EKS 

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: fcg-eks
  NAMESPACE: fcg
  IMAGE_TAG: ${{ github.sha }}

# ─────────────────────────────────────────────────────────────────
# 3 jobs em sequência: se um falha, os seguintes não executam.
# ─────────────────────────────────────────────────────────────────

jobs:

  # ═══════════════════════════════════════════════════════════════
  # JOB 1 — BUILD & TEST
  # ═══════════════════════════════════════════════════════════════
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./FCG.Users

      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: ./FCG.Users

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal
        working-directory: ./FCG.Users


  # ═══════════════════════════════════════════════════════════════
  # JOB 2 — CONTAINERIZE, SCAN & PUSH
  # ═══════════════════════════════════════════════════════════════
  containerize-and-push:
    name: Containerize, Scan & Push
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build da imagem da API com duas tags: latest + hash do commit
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./FCG.Users
          file: ./FCG.Users/FCG.Users.API/Dockerfile
          target: runtime
          push: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/user-api-image:latest
            ${{ secrets.DOCKER_USERNAME }}/user-api-image:${{ env.IMAGE_TAG }}
          load: true

      # Security scan antes do push — falha o pipeline se encontrar CRITICAL ou HIGH
      - name: Security scan - API image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/user-api-image:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push API image
        uses: docker/build-push-action@v5
        with:
          context: ./FCG.Users
          file: ./FCG.Users/FCG.Users.API/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/user-api-image:latest
            ${{ secrets.DOCKER_USERNAME }}/user-api-image:${{ env.IMAGE_TAG }}

      # Build da imagem de migrations com duas tags: migrations + migrations-hash
      - name: Build Migrations image
        uses: docker/build-push-action@v5
        with:
          context: ./FCG.Users
          file: ./FCG.Users/FCG.Users.API/Dockerfile
          target: migrations
          push: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/user-api-image:migrations
            ${{ secrets.DOCKER_USERNAME }}/user-api-image:migrations-${{ env.IMAGE_TAG }}
          load: true

      - name: Security scan - Migrations image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/user-api-image:migrations-${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Migrations image
        uses: docker/build-push-action@v5
        with:
          context: ./FCG.Users
          file: ./FCG.Users/FCG.Users.API/Dockerfile
          target: migrations
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/user-api-image:migrations
            ${{ secrets.DOCKER_USERNAME }}/user-api-image:migrations-${{ env.IMAGE_TAG }}


  # ═══════════════════════════════════════════════════════════════
  # JOB 3 — DEPLOY
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: containerize-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.0'

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Apply namespace and configmap
        run: |
          kubectl apply -f FCG.Users/k8s/usersapi-namespace.yaml
          kubectl apply -f FCG.Users/k8s/usersapi-configmap.yaml

      # Cria/atualiza o Secret do Kubernetes com os valores do GitHub Secrets.
      # Substitui o usersapi-secret.yaml (que tinha valores hardcoded errados).
      # --dry-run=client | kubectl apply garante idempotência: cria na 1ª vez,
      # atualiza nas seguintes sem erro.
      - name: Create or update Kubernetes Secret
        run: |
          kubectl create secret generic usersapi-secret \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=ConnectionStrings__DefaultConnection="${{ secrets.USERS_DB_CONNECTION_STRING }}" \
            --from-literal=Jwt__SecretKey="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DefaultAdmin__Password="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=RabbitMQ__Host="fcg-rabbitmq" \
            --from-literal=RabbitMQ__Username="${{ secrets.RABBITMQ_USERNAME }}" \
            --from-literal=RabbitMQ__Password="${{ secrets.RABBITMQ_PASSWORD }}" \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}" \
            --from-literal=AWS_SQS_QUEUE_URL="${{ secrets.AWS_SQS_QUEUE_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Delete old migration job if exists
        run: |
          kubectl delete job usersapi-migration \
            -n ${{ env.NAMESPACE }} \
            --ignore-not-found=true

      # sed injeta a tag versionada no YAML antes do apply.
      # Jobs têm pod template imutável — não é possível alterar após criação.
      - name: Run database migration
        run: |
          sed -i "s|image:.*user-api-image:migrations.*|image: ${{ secrets.DOCKER_USERNAME }}/user-api-image:migrations-${{ env.IMAGE_TAG }}|" \
            FCG.Users/k8s/usersapi-migration-job.yaml

          kubectl apply -f FCG.Users/k8s/usersapi-migration-job.yaml

          kubectl wait --for=condition=complete \
            job/usersapi-migration \
            -n ${{ env.NAMESPACE }} \
            --timeout=120s

      # kubectl apply cria o deployment se não existir (1º deploy),
      # depois kubectl set image atualiza a tag — acionando o Rolling Update.
      - name: Deploy application (Rolling Update)
        run: |
          kubectl apply -f FCG.Users/k8s/usersapi-deployment.yaml
          kubectl apply -f FCG.Users/k8s/usersapi-service.yaml

          kubectl set image deployment/usersapi \
            usersapi=${{ secrets.DOCKER_USERNAME }}/user-api-image:${{ env.IMAGE_TAG }} \
            -n ${{ env.NAMESPACE }}

          kubectl rollout status deployment/usersapi \
            -n ${{ env.NAMESPACE }} \
            --timeout=180s

      - name: Show deployment status
        if: always()
        run: |
          echo "========== PODS =========="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          echo "========== SERVICES =========="
          kubectl get svc -n ${{ env.NAMESPACE }}
          echo "========== IMAGEM DEPLOYADA =========="
          kubectl get deployment usersapi -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo ""
          echo "========== EVENTOS =========="
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -20
